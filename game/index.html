<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重生2000：娱乐圈</title>
<style>
  :root { --bg:#0e0f1a; --card:#171a2b; --ink:#e8e9f3; --mut:#9aa0c0; --acc:#ff5d8f; --acc2:#5d9bff; --ok:#43d39e; --bar:#2a2e45; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  #app { max-width: 980px; margin: 0 auto; padding: 18px; }
  h1 { font-size: 26px; margin: 6px 0 2px; }
  h3 { margin: 14px 0 8px; color: var(--acc2); font-size: 15px; letter-spacing: .5px; }
  .disc, .warn { font-size: 12px; color: var(--mut); margin: 4px 0; }
  .warn { color: var(--acc); }
  .card { background: var(--card); border: 1px solid #232744; border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 720px){ .grid{ grid-template-columns:1fr; } }
  .row { display:flex; align-items:center; gap:10px; margin:8px 0; }
  .row label { width: 72px; color: var(--mut); font-size: 13px; }
  select, input { flex:1; background:#0f1120; color:var(--ink); border:1px solid #2c3056; border-radius:8px; padding:8px; font-size:14px; }
  .talents { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .talent { display:flex; gap:8px; align-items:flex-start; background:#0f1120; border:1px solid #2c3056; border-radius:8px; padding:8px; font-size:13px; }
  .talent small { display:block; color:var(--mut); margin-top:2px; }
  .talent input { width:16px; flex:none; margin-top:3px; }
  button { cursor:pointer; border:none; border-radius:9px; padding:10px 14px; font-size:14px; background:#262b47; color:var(--ink); transition:.15s; }
  button:hover { background:#313759; }
  .primary { background:linear-gradient(120deg,var(--acc),var(--acc2)); color:#0c0d18; font-weight:700; padding:12px 22px; margin-top:10px; }
  .ghost { background:transparent; border:1px solid #3a4068; }
  .acts { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .acts button { padding:14px 8px; }
  .topbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:4px; }
  .tag { background:#1d2138; border:1px solid #2c3056; border-radius:20px; padding:5px 12px; font-size:12px; color:var(--mut); }
  .stat { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:13px; }
  .stat span { width:34px; color:var(--mut); }
  .stat b { width:30px; text-align:right; }
  .bar { flex:1; height:8px; background:var(--bar); border-radius:6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--acc2),var(--acc)); }
  .era { font-size:12px; color:var(--mut); margin:10px 0; }
  .works { margin:4px 0; padding-left:18px; font-size:13px; color:var(--ink); }
  .works li { margin:2px 0; }
  .mini { font-size:12px; color:var(--mut); margin-top:8px; }
  .log { max-height: 220px; overflow:auto; font-size:13px; }
  .log div { padding:4px 0; border-bottom:1px dashed #232744; color:#cdd2ef; }
  .graph { display:flex; flex-direction:column; gap:4px; font-size:13px; }
  .gedge { background:#0f1120; border:1px solid #2c3056; border-radius:6px; padding:6px 10px; }
  .gedge b { color:var(--acc2); }
  .ach { display:flex; flex-wrap:wrap; gap:6px; }
  .badge { background:linear-gradient(120deg,#2a2350,#3a2a60); border:1px solid #4a3a80; border-radius:16px; padding:5px 12px; font-size:12px; color:#e8e9f3; }
  .choice .ctext { color:#cdd2ef; line-height:1.6; }
  .opts { display:flex; flex-direction:column; gap:8px; margin:14px 0; }
  .opts button { text-align:left; }
  .big { font-size:30px; color:var(--acc); margin:6px 0; }
  .ending { text-align:center; }
  .flash { position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:#222748; border:1px solid #3a4068; padding:10px 18px; border-radius:24px; font-size:13px; opacity:0; transition:.3s; pointer-events:none; }
</style>
</head>
<body>
<div id="app"><p>加载中…</p></div>
<script src="data/npcs.js"></script>
<script src="data/timeline.js"></script>
<script src="data/events.js"></script>
<script src="game.js"></script>
</body>
</html>
